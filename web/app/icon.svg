<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <style>
    :root {
      --seal-color: #8e2c48;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --seal-color: #ea8ca7;
      }
    }
    .seal-ring-outer {
      stroke: var(--seal-color);
      stroke-width: 2.2;
      stroke-dasharray: 96 3 100;
      fill: none;
    }
    .seal-ring-inner {
      stroke: var(--seal-color);
      stroke-width: 1.2;
      stroke-dasharray: 1.5 2;
      fill: none;
    }
    .seal-glyph {
      fill: var(--seal-color);
      font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 500;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
  <circle cx="20" cy="20" r="17.5" class="seal-ring-outer" />
  <circle cx="20" cy="20" r="14.2" class="seal-ring-inner" />
  <text x="20" y="20.5" class="seal-glyph">§</text>
</svg>
